<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cylinder Control — Test Version</title>
<style>
body{font-family:Arial,sans-serif;background:#f5f7fa;color:#17202a;margin:0;display:grid;min-height:100vh;place-items:center;padding:20px;box-sizing:border-box}
.card{max-width:560px;background:#fff;padding:28px;border-radius:14px;box-shadow:0 3px 18px #0001}
h1{font-size:22px;color:#16324f}p{line-height:1.5}.status{color:#536170}.error{color:#a12a2a}
</style>
</head>
<body>
<div class="card">
<h1>Cylinder Control — Safe Test Version</h1>
<p class="status" id="status">Opening the test version. Please wait…</p>
<p>This test page does not replace the normal live app.</p>
</div>
<script>
(async function(){
 const status=document.getElementById("status");
 try{
  const response=await fetch("https://raw.githubusercontent.com/janavh6/cylinder-stock-app/google-login-setup/index.html",{cache:"no-store"});
  if(!response.ok)throw new Error("GitHub could not load the test file (HTTP "+response.status+").");
  const html=await response.text();
  if(!html.includes("cylinder-movement-staging")||!html.includes("TEST VERSION"))throw new Error("The staged test file is not ready yet.");
  document.open();
  document.write(html);
  document.close();
 }catch(error){
  status.className="error";
  status.textContent="The test version could not be opened. Please refresh once. If it still fails, send me this message: "+(error&&error.message?error.message:"Unknown loading error");
 }
})();
</script>
</body>
</html>
